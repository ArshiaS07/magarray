name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --project python
      - run: uvx pre-commit run --all-files --show-diff-on-failure
      - run: uv run --project python ruff check python
      - run: uv run --project python ruff format --check python
      - run: uv run --project python pytest python/tests
