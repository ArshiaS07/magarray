[project]
name = "magarray"
version = "0.2.0"
description = "Host side of the 5x5 LIS3MDL magnetometer board: wire decoder, recorder, live viewer."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyserial>=3.5",
]

# The live viewer (`magarray view`) needs Qt; the decoder, recorder and replay do not, so a
# project that only decodes recordings installs the package without it.
[project.optional-dependencies]
viewer = [
    "pyqtgraph>=0.13.7",
    "PySide6-Essentials>=6.6",
]

[project.scripts]
magarray = "magarray.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["magarray"]

[dependency-groups]
dev = [
    "magarray[viewer]",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "C4", "RET"]
allowed-confusables = ["µ", "×", "−", "–"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
